# YOLOv8s + EMA（P3小目标分支）
# 说明：
# 1. 仅插入一个 EMA，便于做单变量实验
# 2. 使用单尺度写法，避免自定义 YAML 被默认按 nano 配置构建
# 3. 这里虽然写的是 scales.n，但数值实际等同于 yolov8s 的缩放参数

nc: 1  # 单类别：person

scales:
  s: [0.33, 0.50, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 6, C2f, [512, True]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 3, C2f, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11
  - [-1, 3, C2f, [512]]                         # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                   # 14
  - [-1, 3, C2f, [256]]                         # 15 (P3/8，小目标分支)
  - [-1, 1, EMA, [8]]                           # 16 新增 EMA，factor=8

  - [-1, 1, Conv, [256, 3, 2]]                  # 17
  - [[-1, 12], 1, Concat, [1]]                  # 18
  - [-1, 3, C2f, [512]]                         # 19 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]                  # 20
  - [[-1, 9], 1, Concat, [1]]                   # 21
  - [-1, 3, C2f, [1024]]                        # 22 (P5/32)

  - [[16, 19, 22], 1, Detect, [nc]]             # Detect(P3, P4, P5)
