model_path: "E:/Video Pedestrian Flow Statistics and Analysis System Based on YOLO/ultralytics-8.3.163/runs/train/yolov8m_ema_p3_896_sgd_cloud/weights/best.pt"
source: videos/test.mp4
output_dir: outputs/demo_run

# 性能相关（不影响计数逻辑）：限制 UI 刷新/曲线重绘频率 + 处理分辨率上限
performance:
  ui_max_fps: 15.0
  stats_hz: 10.0
  trend_hz: 2.0
  max_width: 1280
  max_height: 800

detector:
  model_path: "E:/Video Pedestrian Flow Statistics and Analysis System Based on YOLO/ultralytics-8.3.163/runs/train/yolov8m_ema_p3_896_sgd_cloud/weights/best.pt"
  imgsz: 512
  conf: 0.3
  iou: 0.45
  device: 0
  half: false
  class_ids:
  - 0
  class_name_map:
    0: person
tracker:
  max_age: 20
  n_init: 2
  nn_budget: 30
  max_iou_distance: 0.9
  max_cosine_distance: 0.35
  embedder: null
  embedder_gpu: false
  half: false
  bgr: true
  polygon: false
  fast_reid: true
  hist_bins_h: 8
  hist_bins_s: 4
  hist_bins_v: 4
counting:
  roi:
    enabled: true
    anchor_point: bottom_center
    polygon:
    - - 567
      - 104
    - - 1278
      - 189
    - - 1118
      - 759
    - - 2
      - 761
    - - 3
      - 376
  line:
    enabled: true
    name: main_line
    anchor_point: center
    points:
    - - 470
      - 132
    - - 1269
      - 246
    labels:
      neg_to_pos: up
      pos_to_neg: down
    min_distance_to_line: 6.0
    cooldown_frames: 36
    dedup_window_frames: 15
    dedup_distance_px: 30
  zones:
  - name: main_area
    enabled: false
    anchor_point: bottom_center
    stale_after_frames: 45
    cooldown_frames: 15
    dedup_window_frames: 12
    dedup_distance_px: 50
    polygon:
    - - 567
      - 104
    - - 1278
      - 189
    - - 1118
      - 759
    - - 2
      - 761
    - - 3
      - 376
static_filter:
  enabled: true
  anchor_point: bottom_center
  history_size: 40
  min_static_frames: 30
  max_movement_px: 18
  forget_after_frames: 90
  hide_static_boxes: true
output:
  save_video: true
  display: true
  video_name: result.mp4
  events_csv_name: events.csv
  summary_json_name: summary.json
  fallback_fps: 25.0
visualization:
  trail_length: 30
  show_confidence: true
  box_thickness: 2
  draw_roi: true
  show_heatmap: true
  heatmap_alpha: 0.35
  heatmap_sigma: 40
  heatmap_interval: 5
debug:
  draw_count_points: true

privacy:
  face_blur:
    enabled: false
    model_path: "models/yolov8n-face.pt"
    conf: 0.4
    blur_type: "gaussian" # gaussian or mosaic
    blur_kernel: 25
  encryption:
    enabled: false
    key_path: "secret.key"
    remove_plaintext: false
